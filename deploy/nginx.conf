# Nginx site for the AI Link Analysis app (behind Cloudflare proxy).
# Installed by deploy/deploy.sh -> /etc/nginx/sites-available/<DOMAIN>
# Domain, port and Cloudflare IP ranges are filled in by the script.

limit_req_zone $binary_remote_addr zone=link_analysis:10m rate=30r/m;

# connection kis IP se aaya (real_ip rewrite se pehle) - sirf Cloudflare allowed
geo $realip_remote_addr $link_analysis_via_cf {
    default 0;
__CLOUDFLARE_GEO__
}

server {
    listen 80;
    server_name __DOMAIN__;

    # asli visitor IP Cloudflare header se, sirf Cloudflare ke IPs par trust
__CLOUDFLARE_IPS__
    real_ip_header CF-Connecting-IP;

    if ($link_analysis_via_cf = 0) { return 444; }

    client_max_body_size 16k;
    server_tokens off;

    location = /link-analysis {
        limit_req zone=link_analysis burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_read_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_read_timeout 30s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }
}
